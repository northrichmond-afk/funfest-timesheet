<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fun Fest Timesheet: Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../shared/brand/favicon.png" type="image/png">
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="site-header">
    <div class="brandbar">
      <a href="./"><img src="../shared/brand/fun-fest-logo.png" alt="Fun Fest" width="71" height="52"></a>
      <span class="brand-sub">Timesheet</span>
    </div>
    <div class="topbar"><div class="topbar-inner">
      <span class="topbar-title" id="roleTitle"></span>
      <span><span id="who" class="small" style="margin-right:.6rem;opacity:.9"></span><button id="signout" class="hidden">Sign out</button></span>
    </div></div>
    <div class="stripe"></div>
  </header>
  <nav id="nav" class="hidden">
    <button data-tab="today">Today</button>
    <button data-tab="rota">Rota</button>
    <button data-tab="entries">Timesheets</button>
    <button data-tab="requests">Requests <span id="reqCount" class="pill warn hidden"></span></button>
    <button data-tab="reports">Reports</button>
    <button data-tab="staff">Staff</button>
    <button data-tab="sites">Venues</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <main id="view"><p class="center muted">Loading…</p></main>
  <dialog id="dlg"></dialog>
  <script type="module" src="admin.js"></script>
</body>
</html>
